[project]
name = "pawsible"
version = "0.1.0"
description = "Adoptable-pet search that reads what shelters actually wrote."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "mypy>=1.14",
    "ruff>=0.8",
    "black>=24.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pawsible"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These two files exist to handle exotic Unicode whitespace, so the literal
# characters are the point rather than a typo. RUF001 flags every one of them.
"pawsible/text/normalize.py" = ["RUF001"]
"tests/unit/test_normalize.py" = ["RUF001"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["pawsible", "evals", "tests"]

# Layer 0 and the extraction pipeline carry the invariants; they are strict.
[[tool.mypy.overrides]]
module = ["pawsible.schema.*", "pawsible.text.*", "pawsible.extraction.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test is allowed to open sockets (never selected in CI)",
    "db: test requires a live Postgres",
]
